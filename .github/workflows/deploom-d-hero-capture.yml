name: Correct Deploom D in original Core hero (design branch only)
on:
  push:
    branches: [design/deploom-d-continuous-hero]
permissions:
  contents: write
jobs:
  patch-original:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic image dependencies
        run: python -m pip install --disable-pip-version-check pillow==12.3.0 numpy==2.3.5 opencv-python-headless==4.13.0.92
      - name: Verify original and replace only D outer stroke
        shell: bash
        run: |
          set -euo pipefail
          echo '909360f1c31f44eb629a300af6ed1b46a06ba405b600986daffb46d98cd67e63  assets/product-hero.jpg' | sha256sum -c -
          python tools/fix_deploom_d_contour.py assets/product-hero.jpg /tmp/corrected.jpg
          cp /tmp/corrected.jpg assets/product-hero.jpg
          sha256sum assets/product-hero.jpg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploom-core-fixed-continuous-D
          path: assets/product-hero.jpg
          if-no-files-found: error
      - name: Commit only corrected hero on design branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/product-hero.jpg
          git diff --cached --quiet && { echo 'No image change'; exit 1; }
          git commit -m 'Fix continuous cyan-violet D in original Deploom Core hero'
          git push origin HEAD:design/deploom-d-continuous-hero
